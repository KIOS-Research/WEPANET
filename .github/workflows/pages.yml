name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build EPANET engine (Emscripten)
        run: bash web-engine/build.sh
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build web app
        working-directory: apps/web
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      # Benchmarks hosted where web pages may not download them (no CORS) are
      # published next to the app, gzipped (crates/eui-ui/src/catalog.rs).
      - name: Add large benchmark networks
        run: |
          mkdir -p apps/web/dist/benchmarks
          curl -fsSL --retry 3 https://filedn.com/lumBFq2P9S74PNoLPWtzxG4/Benchmarks/ky-all-customers.inp \
            | gzip -9 > apps/web/dist/benchmarks/ky-all-customers.inp.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
