name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p epanet-ui-web --target wasm32-unknown-unknown

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, exe: epanet-ui.exe, cli: epanet-cli.exe, name: windows-x64 }
          - { os: macos-latest, exe: epanet-ui, cli: epanet-cli, name: macos-arm64 }
          - { os: ubuntu-latest, exe: epanet-ui, cli: epanet-cli, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo build --release -p epanet-ui -p epanet-cli
      - uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-${{ matrix.name }}
          path: |
            target/release/${{ matrix.exe }}
            target/release/${{ matrix.cli }}
