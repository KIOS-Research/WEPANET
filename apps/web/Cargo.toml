[package]
name = "epanet-ui-web"
description = "EPANET-UI in the browser (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "epanet-ui-web"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eui-ui.workspace = true
eframe.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "Element"] }
