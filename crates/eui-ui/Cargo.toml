[package]
name = "eui-ui"
description = "EPANET-UI user interface (egui), shared by the desktop and web apps"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
eui-core.workspace = true
eui-engine.workspace = true
eframe.workspace = true
egui.workspace = true
egui_plot.workspace = true
rfd.workspace = true
ehttp.workspace = true
log.workspace = true
serde.workspace = true
image.workspace = true
proj4rs.workspace = true
rhai.workspace = true
zip.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }
